name: Secret scan

# gitleaks gate. Blocks a pull request (and flags a push to main) when the
# checked-out tree, or any commit the event adds, contains a credential.
#
#   1. tree:    `gitleaks dir .` over the files at the checked-out ref.
#   2. commits: `gitleaks git` over base..head (pull_request) or
#               before..after (push to main). Catches a secret that was added
#               and removed again inside the same PR.
#
# Commits that predate this gate are not rescanned here. The keys found in
# that history (2026-09-27 audit) are inventoried and handled outside git;
# see SECURITY-NOTES in .gitleaks.toml. History was not rewritten.
#
# The binary comes from the gitleaks GitHub release and is checked against a
# pinned SHA-256 before it runs: no third-party action and no licence key.
# --redact keeps matched values out of the job log.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's
  # gitleaks_8.30.1_checksums.txt (verified 2026-09-27).
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  /tmp/${tarball}" | sha256sum -c -
          tar -xzf "/tmp/${tarball}" -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan the working tree
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gitleaks dir . --config .gitleaks.toml --redact --no-banner --verbose

      - name: Scan the commits this event adds
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ -n "${PUSH_BEFORE}" ] && [ "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            echo "No usable base commit for this push; the tree scan above covers it."
            exit 0
          fi
          echo "Scanning ${range}"
          /tmp/gitleaks git . --config .gitleaks.toml --log-opts="${range}" --redact --no-banner --verbose
