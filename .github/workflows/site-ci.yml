name: site-ci
on:
  push:
    branches: [main]
    paths-ignore:
      - "packages/cli/**"
      - "mem/**"
  # Every pull request starts this workflow, so the `check` status always
  # reports and the main ruleset can require it. A PR that touches only
  # packages/cli or mem/ skips the job (a skipped required check passes);
  # the `changes` job decides. A workflow-level path filter would leave the
  # required check pending forever on those PRs.
  pull_request:

# `packages/cli` has its own workflow (cli-ci.yml) and its own lockfile;
# `mem/` is session notes with nothing to check.

# Read-only: this workflow checks out and builds, nothing more.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      site: ${{ steps.diff.outputs.site }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      # Push runs keep the path filter above, so only PRs are classified.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BASE...$HEAD")"
          echo "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -vE '^(packages/cli/.*|mem/.*|)$' > /dev/null; then
            echo "site=true" >> "$GITHUB_OUTPUT"
          else
            echo "site=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile

      - name: typecheck
        run: bunx tsc --noEmit -p tsconfig.json

      # `npm test` existed for a while and nothing ran it. These cover
      # verifyWebhook — the authentication boundary for license issuance —
      # and are the reason this workflow exists.
      - name: tests
        run: bun run test

      # blog frontmatter, docs-vs-code, and the one-h1-per-route gate.
      # `bun run build` runs these too, but running them first means a
      # content or heading mistake fails in seconds instead of after a
      # full Vite build.
      - name: gates
        run: bun run validate

      # Fully enforced, prettier/prettier included. This step used to pass
      # `--rule '{"prettier/prettier":"off"}'` because the repo carried ~4,080
      # unformatted files and the rule would have made the workflow red from
      # its first run. The tree is formatted now, so the flag is gone and
      # formatting is a build error like anything else.
      - name: lint
        run: bunx eslint .

      - name: build
        run: bun run build

      # Drafts and embargoed posts must never reach a build artifact. The
      # blog module is reachable from client routes, so anything it bundles
      # is public JS; until 2026-09-26 an unpublished post's full markdown
      # shipped that way. Driven by frontmatter, not by any one post.
      - name: no unpublished blog posts in build output
        run: node scripts/check-blog-leaks.mjs
